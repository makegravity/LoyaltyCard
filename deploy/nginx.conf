# ── binmania.startwithdata.com (Bin Mania membership) ──
# Appended to /home/zpl_designer/nginx/zpl-designer.conf on the server (the shared
# nginx mounts that one file). Proxies to the binmania-loyalty container.
#
# First deploy: append the port 80 block, issue the cert with the certbot
# container, then append the 443 block.

server {
    listen 80;
    listen [::]:80;
    server_name binmania.startwithdata.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name binmania.startwithdata.com;

    ssl_certificate     /etc/letsencrypt/live/binmania.startwithdata.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/binmania.startwithdata.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Selfies and offer pictures are sent as JSON (the app caps a body at 8 MB).
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Resolve the container per request (Docker DNS), so this shared nginx still starts
    # when the membership container is stopped.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $binmania http://binmania-loyalty:4090;

    location / {
        proxy_pass $binmania;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwritten, not appended: the app limits sign-ins by this address.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
